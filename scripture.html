<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanskrit Manuscript Interactive Prototype</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper-color: #d1b897;
            --paper-texture-dark: #b89b7b;
            --ink-color: #2b1f1a;
            --red-ink: #c13a2e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Noto Serif Devanagari', serif;
        }

        #manuscript {
            position: relative;
            width: 950px;
            height: 360px;
            /* Paper texture using gradients */
            background-color: var(--paper-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(200, 180, 150, 0) 40%, rgba(130, 100, 70, 0.4) 100%),
                linear-gradient(90deg, rgba(80, 50, 30, 0.2) 0%, rgba(255,255,255,0) 5%, rgba(255,255,255,0) 95%, rgba(80, 50, 30, 0.2) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(0,0,0,0.03) 10px, rgba(0,0,0,0.03) 12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 40px rgba(80, 50, 30, 0.5);
            border-radius: 8px 6px 12px 6px; /* slightly uneven organic edges */
            overflow: hidden;
            cursor: default;
            user-select: none;
        }

        /* The vertical red margin lines */
        .margin-line {
            position: absolute;
            top: 20px;
            bottom: 20px;
            width: 4px;
            background-color: var(--red-ink);
            border-radius: 2px;
            opacity: 0.85;
        }
        #margin-left { left: 80px; }
        #margin-right { right: 80px; }

        /* The Red Dots */
        .dot {
            position: absolute;
            width: 65px;
            height: 65px;
            background-color: var(--red-ink);
            /* handpainted organic imperfect circle */
            border-radius: 48% 52% 50% 50% / 52% 48% 50% 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset 2px 2px 10px rgba(100,20,10,0.5), 0 0 4px rgba(0,0,0,0.2);
            z-index: 10;
        }

        #dot-left { left: 40px; top: 180px; }
        #dot-right { left: 910px; top: 180px; }

        #dot-center {
            cursor: grab;
            transition: border-radius 0.2s;
            /* subtle pulse animation for affordance */
            animation: pulse 3s infinite alternate;
        }
        #dot-center:active {
            cursor: grabbing;
            transform: translate(-50%, -50%) scale(1.05);
            border-radius: 50%;
        }

        @keyframes pulse {
            0% { border-radius: 46% 54% 50% 50% / 54% 46% 50% 50%; }
            50% { border-radius: 52% 48% 54% 46% / 48% 52% 46% 54%; }
            100% { border-radius: 50% 50% 46% 54% / 50% 50% 54% 46%; }
        }

        #text-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .text-line {
            position: absolute;
            white-space: nowrap;
            overflow: hidden;
            font-size: 20px;
            font-weight: 600;
            color: var(--ink-color);
            line-height: 1;
            /* Manuscript scribes justify text tightly */
            text-align: justify;
            text-align-last: justify;
            will-change: transform, width;
            /* Slight blur for ink bleed effect */
            text-shadow: 0px 0px 1px rgba(0,0,0,0.3);
        }

        .red-danda {
            color: var(--red-ink);
            margin: 0 4px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="manuscript">
        <div class="margin-line" id="margin-left"></div>
        <div class="margin-line" id="margin-right"></div>
        
        <div id="dot-left" class="dot"></div>
        <div id="dot-right" class="dot"></div>
        <div id="dot-center" class="dot"></div>
        
        <div id="text-layer"></div>
    </div>

    <!-- MAIN LOGIC -->
    <script type="module">
        import { prepareWithSegments, layoutNextLine } from 'https://esm.sh/@chenglou/pretext';

        // Fake continuous script block, infused with dandas (| and ||) for styling matching
        let sourceText = `जिणाणं|अन्नया|सत्तसया|सुमिणाणं|पासित्ताणं|पडिबुज्झंति||घइ|बलादं|च|मादारं|च|बलादं|च|सिंगप्पंछ|कममाणंसि|एगसिं|च|उद्दसट्टे|महासुमिणाणं|अन्नया|चत्तारि|महासुमिणा|पासित्ताणं|पडिबुज्झंति||घइ|मडंली|च|महारवा|मडंली|च|सिंगप्पंछ|कममाणंसि|एगसिं|च|उद्दसट्टे|महासुमिणाणं|अन्नया|रे|एगं|महासुमिणं|पासित्ताणं|पडिबुज्झंति||घइ|घमदणादवागुणिज्जा|तिमलाएव|तिक्खा|णीए|चउद्दस|महासुमिणा|दिट्ठा|तं|इह|घइ|उग्गलाणं|दवागुणिज्जा|तिमलाएव|तिक्खा|णीए|सुमिणा|दिट्ठा||झामगंझाकार|गाणंद|रागुणिज्जा|तिमलाएव|तिक्खाणीए|सुमिणा|दिट्ठा|तं|इह|घइ|मडंलादवागुणिज्जा|नागला|लादण|उन्नाला|लादण|सुक्कला|लादण|वक्कला|लादण|टवागुणिज्जा|एवंरखादवागुणिज्जा|तिमलाएव|तिक्खाणीए|नव|इमासाणं|बऊण|डियन्नाणं|अदह|माणं|राइडियाणं|विइक्कंताणं|अमुंकला|कइं|अमुंकल|दीहंजं|अमुंकल|पच्चय|अमुंकल|रइंजं||`;
        // Repeat it seamlessly so we never run out
        let fullText = sourceText.repeat(15); 
        // We use space so pretext can word break properly! Usually | is connected to words, but pretext breaks on space.
        // We will insert spaces around | so it layout wraps effectively.
        fullText = fullText.replace(/\|\|/g, " || ").replace(/\|/g, " | ");
        // Ensure continuous density
        fullText = fullText.replace(/\s+/g, ' ').trim();

        const fontStr = `600 20px 'Noto Serif Devanagari', serif`;
        let preparedText = null;

        // Configuration Setup
        const W = 950;
        const H = 360;
        const MARGIN_LEFT = 85; 
        const MARGIN_RIGHT = 865;
        const ROW_START = 30; // 30px from top
        const ROW_END = 330;
        const LINE_HEIGHT = 28;
        const DOT_RADIUS = 32; // actual layout collision radius
        const COLLISION_PAD = 10; // gap between text and dot

        const root = document.getElementById('manuscript');
        const textLayer = document.getElementById('text-layer');
        const centerDot = document.getElementById('dot-center');
        
        let cx = W / 2;
        let cy = H / 2;
        
        // Setup initial position
        centerDot.style.left = `${cx}px`;
        centerDot.style.top = `${cy}px`;

        // DOM Object Pooling to maintain 60fps natively
        let domPool = [];
        for(let i=0; i < 60; i++){
            let el = document.createElement('div');
            el.className = 'text-line';
            textLayer.appendChild(el);
            domPool.push(el);
        }

        function formatRedDandas(str) {
            return str
                .replace(/\|\|/g, '<span class="red-danda">॥</span>')
                .replace(/\|/g, '<span class="red-danda">।</span>');
        }

        // Layout Rendering Engine
        function renderManuscript() {
            if (!preparedText) return;

            let holes = [
                { cx: 40, cy: 180, R: DOT_RADIUS, padding: COLLISION_PAD },   // Left dot
                { cx: 910, cy: 180, R: DOT_RADIUS, padding: COLLISION_PAD },  // Right dot
                { cx, cy, R: DOT_RADIUS, padding: Math.max(0, COLLISION_PAD) } // Interactive dot
            ];

            let rowY = ROW_START;
            let poolIdx = 0;
            // A continuous cursor reading the text source
            let cursor = { segmentIndex: 0, graphemeIndex: 0 };

            while (rowY < ROW_END) {
                // Determine collision geometry along this vertical slice
                let validSegments = [{ start: MARGIN_LEFT, end: MARGIN_RIGHT }];

                for(let h of holes) {
                    let dy = rowY - h.cy; // geometric center approximation for line height center
                    dy += (LINE_HEIGHT / 2); // center it against the text mid-height

                    let collisionRadius = h.R + h.padding;
                    if(Math.abs(dy) >= collisionRadius) continue;

                    let dx = Math.sqrt(collisionRadius*collisionRadius - dy*dy);
                    let hStart = h.cx - dx;
                    let hEnd = h.cx + dx;

                    // Subtract hole from valid segments
                    let nextSegments = [];
                    for(let seg of validSegments) {
                        if(hStart <= seg.start && hEnd >= seg.end) {
                            // fully swallowed
                            continue;
                        } else if(hStart > seg.start && hEnd < seg.end) {
                            // split middle
                            nextSegments.push({start: seg.start, end: hStart});
                            nextSegments.push({start: hEnd, end: seg.end});
                        } else if (hStart > seg.start && hStart < seg.end) {
                            // swallows right slice
                            nextSegments.push({start: seg.start, end: hStart});
                        } else if (hEnd > seg.start && hEnd < seg.end) {
                            // swallows left slice
                            nextSegments.push({start: hEnd, end: seg.end});
                        } else {
                            nextSegments.push(seg);
                        }
                    }
                    validSegments = nextSegments;
                }

                // Pour text sequentially into available horizontal gaps!
                for(let seg of validSegments) {
                    let w = seg.end - seg.start;
                    if (w < 50) continue; // too small for any real word

                    // Get the string layout chunk
                    let line = layoutNextLine(preparedText, cursor, w);
                    if (!line || !line.text) {
                        // Loop the text stream forever if we somehow run out!
                        cursor = { segmentIndex: 0, graphemeIndex: 0 };
                        line = layoutNextLine(preparedText, cursor, w);
                    }
                    
                    if (poolIdx < domPool.length) {
                        let div = domPool[poolIdx];
                        div.style.left = `${seg.start}px`;
                        div.style.top = `${rowY}px`;
                        // Stretching text slightly makes the block flow perfectly rectangular!
                        div.style.width = `${w}px`; 
                        
                        div.innerHTML = formatRedDandas(line.text);
                        div.style.display = 'block';
                    }
                    
                    cursor = line.end;
                    poolIdx++;
                }

                rowY += LINE_HEIGHT;
            }

            // hide unused lines safely
            for(let i = poolIdx; i < domPool.length; i++){
                domPool[i].style.display = 'none';
            }
        }


        // Interaction Engine
        let isDragging = false;
        
        centerDot.addEventListener('mousedown', (e) => {
            isDragging = true;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let rect = root.getBoundingClientRect();
            // Restrict bounds so dot stays within manuscript wrapper
            cx = Math.max(30, Math.min(W - 30, e.clientX - rect.left));
            cy = Math.max(30, Math.min(H - 30, e.clientY - rect.top));

            centerDot.style.left = `${cx}px`;
            centerDot.style.top = `${cy}px`;
            
            // Re-render lightning fast!
            renderManuscript();
        });

        // Initialize mapping when fonts load!
        document.fonts.ready.then(() => {
            // we prepare fullText so `layoutNextLine` has pre-cached sizes!
            preparedText = prepareWithSegments(fullText, fontStr);
            renderManuscript();
        });

    </script>
</body>
</html>
